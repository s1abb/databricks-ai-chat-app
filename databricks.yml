bundle:
  name: databricks-ai-chat-app

variables:
  serving_endpoint_name:
    description: Serving endpoint name
  postgres_branch:
    description: Lakebase Postgres branch
  postgres_database:
    description: Lakebase Postgres database
    
resources:
  apps:
    app:
      name: "databricks-ai-chat-app"
      description: "A Databricks App powered by AppKit"
      source_code_path: ./
      user_api_scopes:
        - serving.serving-endpoints

      # The resources which this app has access to.
      resources:
        - name: serving-endpoint
          serving_endpoint:
            name: ${var.serving_endpoint_name}
            permission: CAN_QUERY
        - name: postgres
          postgres:
            branch: ${var.postgres_branch}
            database: ${var.postgres_database}
            permission: CAN_CONNECT_AND_CREATE

targets:
  default:
    default: true
    workspace:
      host: https://dbc-7ab7901b-2053.cloud.databricks.com

    variables:
      serving_endpoint_name: databricks-gpt-oss-120b
      postgres_branch: projects/chat-app-db/branches/production
      postgres_database: projects/chat-app-db/branches/production/databases/databricks-postgres
